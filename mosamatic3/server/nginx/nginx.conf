server {
    listen 80;
    server_name _;

    # Docker service IPs can change when a container is recreated. Using a
    # variable makes nginx periodically resolve "web" through Docker's DNS
    # instead of retaining the address resolved when nginx first started.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django_backend web:8000;

    client_max_body_size 10G;

    location /static/ {
        alias /staticfiles/;
        access_log off;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }

    location / {
        proxy_pass http://$django_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
}
